name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Linux: system Qt from apt (6.4 on Ubuntu 24.04) – checks the minimum supported Qt version
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  # Windows: MSVC + Qt from the official installer, packaged with windeployqt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir dist
          copy build\Release\bezier_surfaces.exe dist\
          windeployqt --release --no-translations dist\bezier_surfaces.exe
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: bezier_surfaces-windows
          path: dist/

  # macOS: Qt from the official installer, packaged as .dmg with macdeployqt
  # Qt 6.10+: earlier open-source releases link the AGL framework removed in the macOS 26 SDK
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: macdeployqt build/bezier_surfaces.app -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: bezier_surfaces-macos
          path: build/bezier_surfaces.dmg
